# Local PostgreSQL for development.
#   Start:  docker compose up -d
#   Stop:   docker compose down        (data is kept in the named volume)
#   Wipe:   docker compose down -v     (deletes the volume and all data)
services:
  db:
    image: postgres:16-alpine
    container_name: readiness-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: readiness
      POSTGRES_PASSWORD: readiness
      POSTGRES_DB: readiness
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readiness -d readiness"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
